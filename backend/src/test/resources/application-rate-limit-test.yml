spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  forward-headers-strategy: framework

jwt:
  secret: test-jwt-secret-key-for-testing-phase-1-only-a-very-secure-key
  access-ttl-ms: 900000
  refresh-ttl-ms: 604800000
  refresh-grace-seconds: 10

app:
  base-url: http://localhost:5173
  cors:
    origins: http://localhost:5173
  refresh-cookie-secure: false
  rate-limit:
    enabled: true
    auth:
      login-requests-per-hour: 5
      register-requests-per-hour: 5
      forgot-password-requests-per-hour: 5
      reset-password-requests-per-hour: 5