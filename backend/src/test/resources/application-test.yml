spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flowerconnect
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
  doc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false

server:
  forward-headers-strategy: framework

jwt:
  secret: test-jwt-secret-key-for-testing-phase-1-only-a-very-secure-key
  access-ttl-ms: 900000
  refresh-ttl-ms: 604800000
  refresh-grace-seconds: 10

app:
  base-url: http://localhost:5173
  webhook-secret: test-webhook-secret-key-for-testing-phase-3-plus-at-least-32-chars
  cors:
    origins: http://localhost:5173
  refresh-cookie-secure: false
  # Disabled ("-" is Spring's CRON_DISABLED) so a scheduled run cannot fire in the middle
  # of a test and mutate rows the test is asserting on. The expiry sweep is driven directly
  # with the MutableClock bean in InventoryExpiryIntegrationTest instead.
  expiry-sweep-cron: "-"
  # Disabled for the same reason; the auto-reject job is driven directly with the
  # MutableClock bean in AutoRejectIntegrationTest instead.
  auto-reject-cron: "-"
  # Disabled for the same reason; the payment-expiry job is driven directly with
  # the MutableClock bean in PaymentExpiryIntegrationTest instead.
  payment-expiry-cron: "-"
  billing:
    backfill:
      enabled: false
  # Disabled for the same reason; SSE delivery is driven directly in tests rather
  # than by the scheduled heartbeat.
  notification:
    sse:
      heartbeat-cron: "-"
  storage:
    # Overridden per test class that exercises the filesystem
    # (ProductImageIntegrationTest points this at target/test-uploads).
    local-directory: target/test-uploads/default
  image-upload:
    max-file-size-bytes: 5242880
    max-images-per-product: 8
    max-dimension: 1600
    max-pixels: 40000000
    jpeg-quality: 0.85
  checkout:
    platform-fee: 0.00
    default-commission-rate: 0.10
    min-lead-time-minutes: 120
    max-booking-horizon-days: 7
    quote-signing-secret: test-secret-key-for-quote-signing-at-least-32-chars-long
  rate-limit:
    enabled: false
    auth:
      login-requests-per-hour: 5
      register-requests-per-hour: 5
      forgot-password-requests-per-hour: 5
      reset-password-requests-per-hour: 5
