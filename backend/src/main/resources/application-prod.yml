server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_new_id_mappings: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connect-timeout: 5000
          timeout: 10000

jwt:
  secret: ${JWT_SECRET}
  access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:604800000}
  refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}

app:
  base-url: ${APP_BASE_URL}
  cors:
    origins: ${APP_CORS_ORIGINS}
  storage:
    # The local-disk backend is what runs when the 's3' profile is absent, which
    # is the state of this build: the S3StorageService behind that profile is a
    # declared stub that throws (docs/decisions.md D-26). A container-local
    # directory is therefore the only functional option today, and it does not
    # survive a redeploy — mount a volume here before storing real uploads.
    local-directory: ${STORAGE_LOCAL_DIR:/var/lib/flowerconnect/uploads}
  image-upload:
    max-file-size-bytes: 5242880
    max-images-per-product: 8
    max-dimension: 1600
    max-pixels: 40000000
    jpeg-quality: 0.85

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.flowerconnect: INFO
    org.flywaydb: INFO
    org.springframework.security: WARN
