server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: flowerconnect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flowerconnect}
    username: ${DB_USER:flowerconnect}
    password: ${DB_PASS:flowerconnect}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_new_id_mappings: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      # Container-level ceiling for a single upload (plan task 3.8). It is the
      # first line of defence and it matches app.image-upload.max-file-size-bytes,
      # which the service re-checks on the part it actually receives. Raise both
      # together, never one alone.
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connect-timeout: 5000
          timeout: 5000

jwt:
  secret: ${JWT_SECRET}
  access-ttl-ms: ${JWT_ACCESS_TTL_MS:900000}
  refresh-ttl-ms: ${JWT_REFRESH_TTL_MS:604800000}
  refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  rate-limit:
    auth:
      login-requests-per-hour: 5
      register-requests-per-hour: 5
      forgot-password-requests-per-hour: 5
      reset-password-requests-per-hour: 5
  storage:
    # Root for the local-disk StorageService. Which backend is active is a
    # profile decision (s3 switches to the S3 stub), not this property.
    local-directory: ${STORAGE_LOCAL_DIR:uploads}
  image-upload:
    max-file-size-bytes: 5242880
    max-images-per-product: 8
    max-dimension: 1600
    max-pixels: 40000000
    jpeg-quality: 0.85

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.flowerconnect: INFO
    org.flywaydb: INFO
    org.springframework.security: WARN